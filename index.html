<!--
════════════════════════════════════════════════════════════════════
  NORTE CONTABLE v1.1 (Demo) — Gestión de práctica para contables,
  CPAs y preparadores de planillas de Puerto Rico · Norte

  v1.1: prórrogas con fecha original y aviso de pago · checklist de
  documentos por tipo de entidad · flujo preparado/revisado · bitácora
  por cliente · pagos y balances con Hacienda · vencimientos de la
  propia firma (licencia y educación continua)
  v1.2: pestaña TAREAS — cola de trabajo por persona (al completar,
  desaparece de la vista) · flujo de planilla en 5 etapas con fechas
  escalonadas antes del vencimiento · tareas del día en Hoy
  v1.3: NUBE multi-tenant (Supabase) — login por email/contraseña,
  cada firma ve solo lo suyo (RLS), sincronización en vivo entre
  computadoras, logo por firma. El modo demo sigue disponible con
  ?demo en la URL (o abriendo el archivo local); ver supabase/schema.sql
  · vencimientos que caen sábado o domingo se corren al lunes
  · alarma de tareas: aviso al entrar + tarjeta en Hoy + burbuja del
    tab desde 2 días antes del límite de cada tarea
  · servicios de firma en el perfil: estados de banco (día 5),
    QuickBooks (fin de mes), depósito de nómina (día 15) y trimestral
    del 10%; el 480.9A pasa del día 10 al 15 · filtro de clientes por
    servicio en la pestaña Clientes · tributación de la LLC: corporación
    regular (480.2) por defecto o entidad conducto (480.2 EC) según la
    elección hecha al crearse — SC 6045
────────────────────────────────────────────────────────────────────
  INVESTIGACIÓN DE MERCADO (2026):
  · TaxDome  $58–100/usuario/mes · #1 en G2, pero un mes para configurar
  · Karbon   $59–89/usuario/mes + $1,499 de implementación; sin "virtual
             drive" para workpapers (queja recurrente de practicantes)
  · Canopy   $150/mes base, los módulos útiles son add-ons
  · Financial Cents $19–49/usuario/mes · Jetpack $30–56/usuario/mes
  Queja documentada de un usuario sobre entrenamiento: "$350/hr, which
  is beyond ridiculous."

  LOS DOS HUECOS QUE ATACAMOS:
  1. TODOS cobran POR USUARIO. Una firma de 4 personas paga $240–400
     al mes. Norte Contable es FLAT: contrata gente sin que suba.
  2. NINGUNO conoce el calendario contributivo de Puerto Rico. No saben
     qué es la Planilla Mensual de IVU (SC 2915), el 480.9A de retención
     en el origen, el 499-R-1B patronal trimestral, las informativas 480,
     ni que Hacienda pospone fechas por Determinación Administrativa.
     Un practice management que no sabe tus fechas no te sirve de nada.

  ⚠️ AVISO PROFESIONAL: las fechas del catálogo son valores de referencia
  EDITABLES. El contable es responsable de verificar cada vencimiento
  contra el Código de Rentas Internas vigente, las Determinaciones
  Administrativas y Cartas Circulares de Hacienda. Este programa organiza
  el trabajo; NO constituye asesoría contributiva ni sustituye el juicio
  profesional.

  SCHEMA SUPABASE — el vigente está en supabase/schema.sql: tablas
  firmas (data jsonb con todo el estado de la firma) y miembros
  (email → firma + rol), con RLS por email. El detalle de abajo es la
  referencia para cuando se normalice a tablas separadas:
  create table firmas (id uuid pk, nombre text, config jsonb);
  create table clientes (id uuid pk, firma_id uuid fk, nombre text, tipo text, ein text, contacto text, tel text, email text, perfil jsonb, honorario numeric, estado text);
  create table obligaciones (id uuid pk, codigo text, nombre text, forma text, frecuencia text, dia int, base text, aplica jsonb);
  create table radicaciones (id uuid pk, cliente_id uuid fk, obligacion text, periodo text, vence date, vence_original date, estado text, radicado date, confirmacion text, notas text, asignado text, preparado_por text, revisado_por text, monto_pago numeric, pago_pend bool, prorroga jsonb);
  create table pendientes (id uuid pk, cliente_id uuid fk, item text, solicitado date, recibido date, notas text);
  create table bitacora (id uuid pk, cliente_id uuid fk, fecha date, quien text, texto text);
  create table tareas (id uuid pk, cliente_id uuid fk, radicacion_id uuid fk, titulo text, asignado text, vence date, creado date, creado_por text, hecha date, hecha_por text, notas text);
  create table tiempo (id uuid pk, cliente_id uuid fk, fecha date, minutos int, quien text, concepto text, facturable bool);
  create table facturas (id uuid pk, cliente_id uuid fk, num int, fecha date, lineas jsonb, ivu numeric, retencion numeric, total numeric, pagos jsonb);
════════════════════════════════════════════════════════════════════
-->
<style>
/* ══════════ TOKENS — FUTURISTA: PROFUNDO + TEAL ══════════ */
:root{
  --navy:#0F8F80; --navy-d:#0B1220; --navy-m:#3ECFBF; --navy-l:#14343B; --navy-xl:#16202F;
  --ink:#E8EEF6; --muted:#93A5BE; --faint:#5D6C82;
  --bg:#0A0E14; --card:#101826; --line:rgba(140,170,220,.14); --line-d:rgba(140,170,220,.28);
  --gold:#FFB454; --gold-l:rgba(255,180,84,.13);
  --coral:#FF6B5E; --coral-l:rgba(255,107,94,.13);
  --ok:#2FD98C; --ok-l:rgba(47,217,140,.12); --violet:#9D8CFF; --violet-l:rgba(157,140,255,.14);
  --r:12px; --r-s:8px;
  --shadow:0 0 0 1px rgba(140,170,220,.09), 0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 0 0 1px rgba(62,207,191,.18), 0 18px 50px rgba(0,0,0,.65);
  --font:'Space Grotesk','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45;
  background:radial-gradient(1100px 520px at 85% -8%,rgba(62,207,191,.09),transparent 60%),
             radial-gradient(900px 500px at -10% 30%,rgba(157,140,255,.06),transparent 55%),
             var(--bg);
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
select option{background:var(--card);color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(140,170,220,.22);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--navy-m);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ══════════ LOGIN ══════════ */
#loginScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(800px 500px at 50% -10%,rgba(62,207,191,.16),transparent 60%),
             linear-gradient(168deg,#0B1220 0%,#0A0E14 70%,#0D1626 100%)}
.login-card{width:100%;max-width:400px;text-align:center}
.brand-mark{color:#fff;margin-bottom:34px}
.brand-mark .top{font-size:12px;letter-spacing:.42em;text-transform:uppercase;opacity:.7;margin-bottom:10px;color:var(--navy-m)}
.brand-mark h1{font-size:40px;font-weight:700;letter-spacing:.1em;line-height:1;text-shadow:0 0 34px rgba(62,207,191,.35)}
.brand-mark h1 span{color:var(--navy-m);font-weight:300}
.brand-mark .sub{font-size:13.5px;opacity:.75;margin-top:12px;letter-spacing:.04em}
.brand-roof{width:110px;height:16px;margin:18px auto 0;opacity:.6}
.login-box{background:rgba(16,24,38,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-d);border-radius:18px;padding:28px 26px;box-shadow:var(--shadow-lg)}
.login-box label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
#pinInput{width:100%;text-align:center;font-size:30px;letter-spacing:.5em;padding:12px 8px 12px 16px;border:2px solid var(--line-d);border-radius:var(--r);font-weight:700;background:#0C1420;color:var(--ink);font-family:var(--mono)}
#pinInput:focus{border-color:var(--navy-m);outline:none;box-shadow:0 0 0 3px rgba(62,207,191,.18)}
#loginNube input{width:100%;padding:12px 14px;border:2px solid var(--line-d);border-radius:var(--r);font-size:16px;margin-bottom:10px;background:#0C1420;color:var(--ink)}
#loginNube input:focus{border-color:var(--navy-m);outline:none;box-shadow:0 0 0 3px rgba(62,207,191,.18)}
#loginNube .btn{width:100%;justify-content:center;padding:12px;font-size:16px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pinpad button{padding:14px 0;font-size:20px;font-weight:600;background:var(--navy-xl);border:1px solid var(--line);border-radius:var(--r);transition:all .14s;font-family:var(--mono)}
.pinpad button:hover{background:var(--navy-l);border-color:var(--navy-m);box-shadow:0 0 14px rgba(62,207,191,.25)}
.pinpad button.act{background:var(--navy);color:#fff;border-color:transparent}
.login-hint{margin-top:16px;font-size:12.5px;color:var(--muted)}
.login-err{color:var(--coral);font-size:13px;margin-top:10px;min-height:18px;font-weight:600}

/* ══════════ APP SHELL ══════════ */
#app{display:none;min-height:100vh}
header.topbar{background:rgba(11,18,32,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);color:#fff;padding:0 18px;display:flex;align-items:center;gap:14px;height:58px;position:sticky;top:0;z-index:90}
.topbar .logo{font-weight:700;letter-spacing:.08em;font-size:16px;white-space:nowrap}
.topbar .logo span{color:var(--navy-m);font-weight:300}
.topbar .clin{font-size:12.5px;opacity:.72;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.topbar .datebox{font-size:12.5px;opacity:.85;text-align:right;line-height:1.25;white-space:nowrap}
.topbar .who{background:rgba(62,207,191,.14);border:1px solid rgba(62,207,191,.3);color:var(--navy-m);padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.topbar .out{opacity:.75;font-size:12.5px;padding:6px 4px}
.topbar .out:hover{opacity:1}
nav.tabs{background:rgba(13,20,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:58px;z-index:89;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:13px 15px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:color .14s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--navy-m);border-bottom-color:var(--navy-m);text-shadow:0 0 18px rgba(62,207,191,.5)}
nav.tabs button .bub{background:var(--coral);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;box-shadow:0 0 10px rgba(255,107,94,.5)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 90px}

/* ══════════ PRIMITIVES ══════════ */
.card{background:linear-gradient(180deg,rgba(140,170,220,.045),transparent 40%),var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card.tight{padding:14px}
.card h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .grow{flex:1}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:4px;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-s);font-size:14px;font-weight:600;background:linear-gradient(160deg,#12A796,#0C7F72);color:#fff;transition:all .14s;line-height:1.2;box-shadow:0 2px 12px rgba(18,167,150,.28)}
.btn:hover{filter:brightness(1.14);box-shadow:0 2px 18px rgba(18,167,150,.45)}
.btn.sec{background:var(--navy-xl);color:var(--navy-m);border:1px solid var(--line-d);box-shadow:none}
.btn.ghost{background:transparent;color:var(--navy-m);border:1.5px solid var(--line-d);box-shadow:none}
.btn.warn{background:linear-gradient(160deg,#E85B4C,#C23B2C);box-shadow:0 2px 12px rgba(232,91,76,.3)}
.btn.ok{background:linear-gradient(160deg,#27BD79,#188F58);box-shadow:0 2px 12px rgba(39,189,121,.3)}
.btn.gold{background:linear-gradient(160deg,#E8A244,#C07E22);box-shadow:0 2px 12px rgba(232,162,68,.3)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wa{background:linear-gradient(160deg,#22C063,#149A4A)}
.link{color:var(--navy-m);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.b-gray{background:rgba(140,170,220,.12);color:var(--muted)}
.b-navy{background:var(--navy-l);color:var(--navy-m)}
.b-gold{background:var(--gold-l);color:var(--gold)}
.b-coral{background:var(--coral-l);color:var(--coral)}
.b-ok{background:var(--ok-l);color:var(--ok)}
.b-violet{background:var(--violet-l);color:var(--violet)}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--faint)}
.money{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:30px;margin-bottom:8px}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1.5px solid var(--line-d);font-weight:700}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover td{background:rgba(62,207,191,.06);cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line-d);border-radius:var(--r-s);background:#0C1420;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--navy-m);outline:none;box-shadow:0 0 0 3px rgba(62,207,191,.15)}
.fld textarea{resize:vertical;min-height:64px}
.fld .note{font-size:12px;color:var(--faint);margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:560px){.frow,.frow3{grid-template-columns:1fr}}
.chkline{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.chkline input{width:17px;height:17px;accent-color:var(--navy-m)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpis.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.kpis,.kpis.c3{grid-template-columns:1fr 1fr}}
.kpi{background:linear-gradient(180deg,rgba(140,170,220,.05),transparent 45%),var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;font-family:var(--mono);text-shadow:0 0 22px rgba(232,238,246,.18)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.kpi.hot .v{color:var(--coral);text-shadow:0 0 22px rgba(255,107,94,.35)}
.kpi.good .v{color:var(--ok);text-shadow:0 0 22px rgba(47,217,140,.35)}

/* ══════════ MAPA DE CUOTAS — elemento firma ══════════ */
.umap{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.utile{border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:transform .1s,box-shadow .14s}
.utile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.utile .n{font-weight:700;font-size:14.5px;font-family:var(--mono)}
.utile .s{font-size:10.5px;font-weight:700;margin-top:2px;letter-spacing:.02em}
.utile.ok{background:var(--ok-l);color:var(--ok);border-color:rgba(47,217,140,.35)}
.utile.warn{background:var(--gold-l);color:var(--gold);border-color:rgba(255,180,84,.35)}
.utile.bad{background:var(--coral-l);color:var(--coral);border-color:rgba(255,107,94,.35)}
.utile.off{background:rgba(140,170,220,.07);color:var(--faint);border-color:var(--line)}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.maplegend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* estado de cuenta / historial */
.histitem{border-left:3px solid rgba(62,207,191,.4);padding:8px 0 8px 14px;margin-left:6px}
.histitem .d{font-size:12px;color:var(--faint);font-weight:700}
.remitem{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.remitem:last-child{border-bottom:none}
.remitem .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.remitem .bd{flex:1;min-width:180px}
.remitem .bd .n{font-weight:700;font-size:14px}
.remitem .bd .s{font-size:12.5px;color:var(--muted)}
svg.chart{width:100%;height:150px;display:block}

/* subtabs (ficha unidad / comunidad) */
.subtabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:16px 0 14px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--navy-m);border-bottom-color:var(--navy-m)}

/* ══════════ MODAL / TOAST ══════════ */
#modalRoot{position:fixed;inset:0;z-index:150;display:none;align-items:flex-start;justify-content:center;background:rgba(4,8,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:24px 12px;overflow-y:auto}
#modalRoot.open{display:flex}
.modal{background:#101826;border:1px solid var(--line-d);border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:pop .16s ease;margin:auto 0}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:17px;font-weight:700}
.modal .mh button{font-size:22px;color:var(--faint);padding:2px 8px;line-height:1}
.modal .mb{padding:18px 20px}
.modal .mf{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;background:#182640;border:1px solid var(--line-d);color:var(--ink);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);display:none;max-width:92vw;text-align:center}
#toast.warn{background:#3A1712;border-color:rgba(255,107,94,.5);color:#FFB0A8}
#toast.show{display:block;animation:toastin .2s ease}
@keyframes toastin{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ══════════ PRINT (se mantiene claro: es papel) ══════════ */
#printArea{display:none}
@media print{
  body.printing #app,body.printing #loginScreen,body.printing #modalRoot,body.printing #toast{display:none!important}
  body.printing #printArea{display:block!important}
  @page{margin:14mm}
}
.pr-doc{font-family:Georgia,'Times New Roman',serif;color:#111;font-size:13px;line-height:1.5;max-width:720px;background:#fff}
.pr-doc .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #22333B;padding-bottom:10px;margin-bottom:16px}
.pr-doc .ph .b{font-size:19px;font-weight:800;letter-spacing:.06em;font-family:'Segoe UI',system-ui,sans-serif}
.pr-doc .ph .b span{font-weight:300;color:#40575F}
.pr-doc .ph .cd{font-size:11.5px;text-align:right;color:#333}
.pr-doc h2{font-size:16px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 10px;font-family:'Segoe UI',system-ui,sans-serif}
.pr-doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.pr-doc th{background:#EFF3F3;text-align:left;padding:6px 9px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #C6D0D6;font-family:'Segoe UI',system-ui,sans-serif}
.pr-doc td{padding:6px 9px;border:1px solid #DDE3E0}
.pr-doc .sig{margin-top:44px;display:flex;gap:40px}
.pr-doc .sig .s{flex:1;border-top:1.5px solid #333;padding-top:5px;font-size:11.5px;text-align:center}
.pr-doc .fine{font-size:10.5px;color:#555;margin-top:14px}
.pr-doc .tot{text-align:right;font-size:15px;font-weight:800;margin-top:6px}

/* ══════════ TABLERO DE RADICACIÓN ══════════ */
.rad-wrap{overflow-x:auto;padding-bottom:6px}
.rad{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.rad th{padding:7px 8px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-weight:700;border-bottom:2px solid var(--line-d);background:var(--card);position:sticky;top:0}
.rad th.cli{text-align:left;min-width:190px;left:0;z-index:3}
.rad td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center}
.rad td.cli{text-align:left;font-weight:700;font-size:12.5px;white-space:nowrap;background:var(--card);position:sticky;left:0;z-index:2;padding-right:14px}
.rad td.cli .sub{display:block;font-weight:500;font-size:10.5px;color:var(--faint)}
.chip{display:inline-block;min-width:30px;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;border:1.5px solid transparent;user-select:none;line-height:1.35;font-family:var(--mono)}
.chip.pend{background:rgba(140,170,220,.06);border-color:var(--line-d);color:var(--faint)}
.chip.prox{background:var(--gold-l);border-color:rgba(255,180,84,.45);color:var(--gold)}
.chip.venc{background:var(--coral-l);border-color:rgba(255,107,94,.45);color:var(--coral)}
.chip.list{background:var(--ok-l);border-color:rgba(47,217,140,.45);color:var(--ok)}
.chip.prorr{background:var(--violet-l);border-color:rgba(157,140,255,.45);color:var(--violet)}
.chip.na{background:transparent;border-color:transparent;color:rgba(140,170,220,.25)}
.chip:hover{filter:brightness(1.2)}
/* semáforo de plazo */
.dl{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl .dd{width:44px;text-align:center;flex-shrink:0;border-radius:8px;padding:5px 2px;font-weight:700;font-size:15px;line-height:1.05;font-family:var(--mono)}
.dl .dd small{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.8}
.dl .dd.r{background:var(--coral-l);color:var(--coral)} .dl .dd.a{background:var(--gold-l);color:var(--gold)} .dl .dd.v{background:var(--ok-l);color:var(--ok)}
.dl .bd{flex:1;min-width:0}
.dl .bd .n{font-weight:700;font-size:13.5px}

.avisoley b{color:var(--gold)}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

/* ══════════ NUBE (SUPABASE) — multi-tenant ══════════
   Modo demo: ?demo en la URL, o abrir el archivo local (file://).
   Modo nube: el site publicado sin ?demo. Cada firma ve solo lo suyo
   (RLS por email en supabase/schema.sql); el estado completo de la
   firma viaja como un JSON en firmas.data. */
const SUPA_URL='https://rysecnkzdabypdltlrtw.supabase.co';
const SUPA_KEY='sb_publishable_Df4f1w8LDtx21VGYtJHYbg_DA9pFWpD';
const _qs=new URLSearchParams(location.search);
const DEMO=_qs.has('demo')||(location.protocol==='file:'&&!_qs.has('nube'));
const sb=(!DEMO&&window.supabase)?window.supabase.createClient(SUPA_URL,SUPA_KEY):null;
const nube={firmaId:null,rol:null,quien:'',canal:null,saveTimer:null,ultimoGuardado:0};

/* ══════════ CONSTANTES ══════════ */
const TIPOS_CLIENTE=['Individuo','Individuo con negocio','Corporación','LLC','Entidad conducto','Sin fines de lucro'];
const EST_RAD={pendiente:{n:'Pendiente',cls:'pend'},proceso:{n:'En proceso',cls:'prox'},espera:{n:'Esperando cliente',cls:'prox'},prorroga:{n:'En prórroga',cls:'prorr'},radicado:{n:'Radicado',cls:'list'},na:{n:'No aplica',cls:'na'}};
/* el Registro de Comerciante es un certificado: solo Pendiente o Vigente */
function estadosDeObl(oblId){
  return oblId==='registro' ? {pendiente:{n:'Pendiente',cls:'pend'},radicado:{n:'Vigente',cls:'list'}} : EST_RAD;
}
/* nombre amigable de la obligación: "Retención 10%" en vez de "480.9A" */
function oblNombre(o){ return (o&&(o.alias||o.forma))||''; }
function nombreEstado(r){
  if(r.oblId==='registro'&&r.estado==='radicado') return 'Vigente';
  return (EST_RAD[r.estado]||{n:r.estado}).n;
}
const METODOS_PAGO=['ATH Móvil','Transferencia','Cheque','Efectivo','Tarjeta'];
const MESES_ABR=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_FULL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOCS_COMUNES=['Estados de banco','Facturas de gastos','Nómina del período','Informativas 480 recibidas','W-2 / 499R-2','Comprobantes de retención','Inventario al cierre','Contratos nuevos','Recibos de contribución sobre la propiedad'];

/* ══════════ STORAGE / UTILS ══════════ */
const STORE_KEY='norteContable_v1';
let memStore=null;
function storeKey(){ return nube.firmaId?'norteContable_'+nube.firmaId:STORE_KEY; }
function storageGet(){ try{ return localStorage.getItem(storeKey()); }catch(e){ return memStore; } }
function storageSet(v){ try{ localStorage.setItem(storeKey(),v); }catch(e){ memStore=v; } }
let state=null;
function saveState(){
  storageSet(JSON.stringify(state));
  if(sb&&nube.firmaId){
    clearTimeout(nube.saveTimer);
    nube.saveTimer=setTimeout(subirNube,800);
  }
}
async function subirNube(){
  nube.ultimoGuardado=Date.now();
  try{
    const {error}=await sb.from('firmas').update({data:state,updated_at:new Date().toISOString()}).eq('id',nube.firmaId);
    if(error) throw error;
  }catch(e){
    toast('⚠️ No se pudo guardar en la nube — revisa tu internet',true);
  }
}
function loadState(){
  const raw=storageGet();
  if(raw){ try{ state=JSON.parse(raw); if(state&&state.clientes){ migrar(); return; } }catch(e){} }
  state=seedState(); saveState();
}
function migrar(){
  /* completa campos que un estado guardado por versiones anteriores no tiene */
  const c=state.config;
  let dirty=false;
  if(!c.plantillasDocs){ c.plantillasDocs=plantillasDefault(); dirty=true; }
  if(!state.bitacora){ state.bitacora=[]; dirty=true; }
  if(!state.tareas){ state.tareas=[]; dirty=true; }
  if(c.firma.licVence===undefined){ c.firma.licVence=''; c.firma.educVence=''; dirty=true; }
  if(c.firma.logo===undefined){ c.firma.logo=''; dirty=true; }
  /* obligaciones nuevas del catálogo que el estado guardado no tiene */
  catalogoObligaciones().forEach(o=>{
    const ex=c.obligaciones.find(x=>x.id===o.id);
    if(!ex){ c.obligaciones.push(o); dirty=true; }
    else if(ex.alias===undefined&&o.alias){ ex.alias=o.alias; dirty=true; }
  });
  const r480=c.obligaciones.find(o=>o.id==='ret480');
  if(r480&&r480.dia===10){ r480.dia=15; dirty=true; }
  state.clientes.forEach(cl=>{
    const p=cl.perfil||{};
    if(p.banco===undefined){ p.banco=false; p.quickbooks=false; p.nomina=false; dirty=true; }
    if(cl.tributacion===undefined){ cl.tributacion='corp'; dirty=true; }
  });
  state.radicaciones.forEach(r=>{
    if(r.preparadoPor===undefined){ r.preparadoPor=''; r.revisadoPor=''; r.montoPago=null; r.pagoPend=false; dirty=true; }
  });
  /* Registro de Comerciante: deja de generarse por período — pasa a ser
     dato del cliente (número + fecha de vencimiento del certificado) */
  if(state.radicaciones.some(r=>r.oblId==='registro')||c.obligaciones.some(o=>o.id==='registro')){
    state.radicaciones.filter(r=>r.oblId==='registro').forEach(r=>{
      const cl=getCli(r.cliId);
      if(cl&&r.confirmacion&&!cl.regComNum) cl.regComNum=r.confirmacion;
    });
    state.radicaciones=state.radicaciones.filter(r=>r.oblId!=='registro');
    c.obligaciones=c.obligaciones.filter(o=>o.id!=='registro');
    dirty=true;
  }
  /* renovaciones: lista configurable de permisos/certificados por cliente;
     los campos viejos de Registro de Comerciante se mudan a la lista */
  if(!c.renovables){ c.renovables=renovablesDefault(); dirty=true; }
  state.clientes.forEach(cl=>{
    if(cl.renovaciones===undefined){ cl.renovaciones={}; dirty=true; }
    if(cl.regComNum||cl.regComVence){
      if(!cl.renovaciones['Registro de Comerciante'])
        cl.renovaciones['Registro de Comerciante']={num:cl.regComNum||'',vence:cl.regComVence||''};
      delete cl.regComNum; delete cl.regComVence; dirty=true;
    }
  });
  if(dirty) saveState();
}

/* ══════════ ENTRADA A LA NUBE ══════════ */
function estadoVacio(nombreFirma){
  /* estado inicial de una firma real: catálogo listo, datos en cero */
  return {
    config:{
      firma:{nombre:nombreFirma||'Mi firma',lic:'',dir:'',tel:'',email:'',licVence:'',educVence:'',logo:''},
      pins:{admin:'1234',staff:'0000'},
      avisoDias:10, ivu:{activo:true,pct:4}, retencionPct:10, tarifaHora:85, proxFactura:1001,
      staff:['Socio'],
      obligaciones:catalogoObligaciones(),
      plantillasDocs:plantillasDefault(),
      renovables:renovablesDefault(),
    },
    clientes:[], radicaciones:[], pendientes:[], tiempo:[], facturas:[], bitacora:[], tareas:[],
  };
}
function mostrarLoginNube(msg){
  $id('loginScreen').style.display='flex'; $id('app').style.display='none';
  $id('loginDemo').style.display='none'; $id('loginNube').style.display='block';
  if(msg) $id('loginErrNube').textContent=msg;
  setTimeout(()=>{ const i=$id('emailInput'); if(i&&i.focus) i.focus(); },150);
}
async function entrarNube(){
  try{
    const {data:{session:ses}}=await sb.auth.getSession();
    if(!ses){ mostrarLoginNube(); return; }
    await cargarFirma(ses);
  }catch(e){ mostrarLoginNube('No se pudo conectar. Revisa tu internet y recarga.'); }
}
async function loginNube(){
  let email=$id('emailInput').value.trim(), pass=$id('passInput').value;
  if(!email||!pass){ $id('loginErrNube').textContent='Escribe tu usuario y contraseña'; return; }
  if(email.indexOf('@')<0) email+='@norte.app';   /* "rosado" → rosado@norte.app */
  $id('loginErrNube').textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ $id('loginErrNube').textContent='Usuario o contraseña incorrectos'; return; }
  $id('loginErrNube').textContent='';
  await cargarFirma(data.session);
}
async function cargarFirma(ses){
  const email=ses.user.email;
  const {data:m,error:e1}=await sb.from('miembros').select('*').eq('email',email).maybeSingle();
  if(e1||!m){ await sb.auth.signOut(); mostrarLoginNube('Esa cuenta no está asignada a ninguna firma. Contacta a Norte.'); return; }
  const {data:f,error:e2}=await sb.from('firmas').select('*').eq('id',m.firma_id).single();
  if(e2||!f){ mostrarLoginNube('No se pudo cargar la información de la firma.'); return; }
  nube.firmaId=f.id; nube.rol=m.rol; nube.quien=m.nombre||email.split('@')[0];
  state=f.data||estadoVacio(f.nombre);
  migrar();
  if(!f.data) await subirNube();      /* primera vez: siembra el estado inicial */
  storageSet(JSON.stringify(state));  /* copia local de respaldo */
  session.role= m.rol==='socio'?'admin':'staff';
  $id('loginScreen').style.display='none'; $id('app').style.display='block';
  $id('topWho').textContent=nube.quien+' · '+(isAdmin()?'Socio':'Staff');
  document.querySelectorAll('#mainTabs button').forEach(b=>{ b.style.display=(isAdmin()||!b.dataset.admin)?'':'none'; });
  generarPeriodo(mesISO());
  setTab('hoy');
  suscribirNube();
  alarmaTareas();
}
function suscribirNube(){
  if(nube.canal||!sb) return;
  nube.canal=sb.channel('firma-'+nube.firmaId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'firmas',filter:'id=eq.'+nube.firmaId},p=>{
      if(Date.now()-nube.ultimoGuardado<3000) return;   /* eco de nuestro propio guardado */
      if(p.new&&p.new.data){
        state=p.new.data;
        storageSet(JSON.stringify(state));
        renderAll();
        toast('Datos actualizados por otro miembro de la firma');
      }
    }).subscribe();
}
const $id=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mesISO(){ return hoyISO().slice(0,7); }
function daysFrom(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addMeses(iso,n){ const d=parseISO(iso); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mesRel(n){ const d=new Date(); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function parseISO(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d||1); }
function diffDias(a,b){ return Math.round((parseISO(a)-parseISO(b))/86400000); }
function fmtF(iso){ if(!iso) return '—'; const d=parseISO(iso); return d.getDate()+' '+MESES_ABR[d.getMonth()]+' '+d.getFullYear(); }
function fmtCorta(iso){ const d=parseISO(iso); return d.getDate()+' '+MESES_ABR[d.getMonth()]; }
function fmtMes(mes){ const [y,m]=mes.split('-').map(Number); return MESES_FULL[m-1]+' '+y; }
function money(n){ const v=Number(n)||0; return (v<0?'-$':'$')+Math.abs(v).toFixed(2); }
function hhmm(min){ const h=Math.floor(min/60), m=min%60; return h+'h'+(m?' '+m+'m':''); }
function telWA(t){ const d=String(t||'').replace(/\D/g,''); return d.length===10?'1'+d:d; }
function waLink(tel,txt){ return 'https://wa.me/'+telWA(tel)+'?text='+encodeURIComponent(txt); }
function toast(msg,warn){ const t=$id('toast'); t.textContent=msg; t.className=warn?'warn show':'show'; clearTimeout(t._to); t._to=setTimeout(()=>t.className='',3000); }
function openModal(titulo,html,wide){
  const box=$id('modalBox');
  box.className='modal'+(wide?' wide':'');
  box.innerHTML='<div class="mh"><h3>'+esc(titulo)+'</h3><button onclick="closeModal()" aria-label="Cerrar">×</button></div>'+html;
  $id('modalRoot').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){ $id('modalRoot').classList.remove('open'); document.body.style.overflow=''; }
function askConfirm(msg,onYes){
  openModal('Confirmar','<div class="mb"><p style="font-size:15px">'+esc(msg)+'</p></div>'
    +'<div class="mf"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn warn" id="confirmYesBtn">Sí, continuar</button></div>');

    /* una LLC tributa como corporación POR DEFECTO en PR, salvo elección
       de conducto hecha al crearse (cli.tributacion==='conducto') */

    case 'banco': return !!p.banco;

function ultimoDiaMes(y,m){ return new Date(y,m,0).getDate(); }
/* Si el vencimiento cae sábado o domingo, corre al lunes siguiente
   (regla general de Hacienda e IRS para pagos y radicaciones). */
function rodarFinDeSemana(iso){
  const d=parseISO(iso), dow=d.getDay();
  if(dow===6) d.setDate(d.getDate()+2);
  else if(dow===0) d.setDate(d.getDate()+1);
  else return iso;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fechaVence(obl,periodo,cli){ return rodarFinDeSemana(fechaVenceBase(obl,periodo,cli)); }
function fechaVenceBase(obl,periodo,cli){
  /* periodo: 'YYYY-MM' para mensual, 'YYYY-Tn' trimestral, 'YYYY' anual */
  const dia=obl.dia||15;
  if(obl.frec==='mensual'){
    const [y,m]=periodo.split('-').map(Number);
    const d=new Date(y,m-1+(obl.offset||1),1);
    const dd=Math.min(dia,ultimoDiaMes(d.getFullYear(),d.getMonth()+1));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  }
  if(obl.frec==='trimestral'){
    const [y,t]=periodo.split('-T').map(Number);
    const mesCierre=t*3;                       /* T1 cierra en marzo */
    const d=new Date(y,mesCierre,1);           /* mes siguiente */
    const dd=Math.min(dia,ultimoDiaMes(d.getFullYear(),d.getMonth()+1));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  }
  if(obl.frec==='estimada'){
    const [y,q]=periodo.split('-Q').map(Number);
    const par=obl.dias[(q||1)-1];
    const anio= (q===4)? y+1 : y;              /* el cuarto plazo cae en enero siguiente */
    return anio+'-'+String(par[0]).padStart(2,'0')+'-'+String(par[1]).padStart(2,'0');
  }
  if(obl.frec==='anual'){
    const y=Number(periodo)+1;                 /* se radica el año siguiente al contributivo */
    return y+'-'+String(obl.mes).padStart(2,'0')+'-'+String(obl.dia).padStart(2,'0');
  }
  if(obl.frec==='anual_mismo'){                /* renovación: vence dentro del mismo año */
    return periodo+'-'+String(obl.mes).padStart(2,'0')+'-'+String(obl.dia).padStart(2,'0');
  }
  if(obl.frec==='anual_cierre'){
    const cierre=(cli&&cli.cierre)||'12';      /* mes de cierre fiscal, '12' = diciembre */
    const mc=Number(cierre);
    const y=Number(periodo);
    const d=new Date(y,mc-1+(obl.mesesTrasCierre||3)+1,1);
    const dd=Math.min(obl.dia||15,ultimoDiaMes(d.getFullYear(),d.getMonth()+1));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  }
  return hoyISO();
}
function etiquetaPeriodo(periodo){
  if(periodo.indexOf('-T')>0){ const [y,t]=periodo.split('-T'); return 'T'+t+' '+y; }
  if(periodo.indexOf('-Q')>0){ const [y,q]=periodo.split('-Q'); return 'Plazo '+q+' '+y; }
  if(periodo.indexOf('-')>0) return fmtMes(periodo);
  return 'Año '+periodo;
}

/* ══════════ GENERACIÓN Y ESTADO DE RADICACIONES ══════════ */
function periodosDe(obl,ref){
  /* ref = 'YYYY-MM' del mes de trabajo; devuelve los períodos con vencimiento cercano */
  const [y,m]=ref.split('-').map(Number);
  if(obl.frec==='mensual') return [mesRelDe(ref,-1), ref];        /* el mes pasado y el corriente */
  if(obl.frec==='trimestral'){ const t=Math.ceil(m/3); const tp=t===1?4:t-1; const yp=t===1?y-1:y; return [yp+'-T'+tp, y+'-T'+t]; }
  if(obl.frec==='estimada') return [y+'-Q1',y+'-Q2',y+'-Q3',y+'-Q4'];
  if(obl.frec==='anual_mismo') return [String(y)];   /* renovaciones: una sola por año, el año corriente */
  return [String(y-1), String(y)];
}
function mesRelDe(mes,n){ const [y,m]=mes.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function keyRad(cliId,oblId,periodo){ return cliId+'|'+oblId+'|'+periodo; }
function getRad(cliId,oblId,periodo){
  return state.radicaciones.find(r=>r.cliId===cliId&&r.oblId===oblId&&r.periodo===periodo)||null;
}
function asegurarRad(cliId,oblId,periodo){
  let r=getRad(cliId,oblId,periodo);
  if(r) return r;
  const cli=getCli(cliId), obl=getObl(oblId);
  if(!cli||!obl) return null;
  r={id:uid('r'),cliId,oblId,periodo,vence:fechaVence(obl,periodo,cli),estado:'pendiente',
     radicado:null,confirmacion:'',asignado:'',notas:'',
     preparadoPor:'',revisadoPor:'',montoPago:null,pagoPend:false};
  state.radicaciones.push(r);
  return r;
}
function generarPeriodo(ref){
  let n=0;
  clientesActivos().forEach(cli=>{
    state.config.obligaciones.forEach(obl=>{
      if(!aplicaA(cli,obl)) return;
      periodosDe(obl,ref).forEach(per=>{
        if(!getRad(cli.id,obl.id,per)){ asegurarRad(cli.id,obl.id,per); n++; }
      });
    });
  });
  if(n) saveState();
  return n;
}
function estadoRad(r){
  if(!r) return 'pend';
  if(r.estado==='radicado') return 'list';
  if(r.estado==='na') return 'na';
  const d=diffDias(r.vence,hoyISO());
  if(d<0) return 'venc';
  if(r.estado==='prorroga') return d<=state.config.avisoDias?'prox':'prorr';
  if(d<=state.config.avisoDias) return 'prox';
  return 'pend';
}

function subFactura(f){ return Math.round((f.lineas||[]).reduce((s,l)=>s+l.cant*l.precio,0)*100)/100; }
function ivuFactura(f){
  /* Servicios profesionales entre comerciantes: régimen especial en PR.
     La tasa es configurable y el aviso legal vive en Config y en la factura. */
  if(!state.config.ivu.activo||f.exentoIVU) return 0;

function pagadoFactura(f){ return Math.round((f.pagos||[]).reduce((s,p)=>s+p.monto,0)*100)/100; }

let session={role:null};
const isAdmin=()=>session.role==='admin';

function pinKey(k){ const i=$id('pinInput'); if(k==='C') i.value=i.value.slice(0,-1); else if(i.value.length<4) i.value+=k; }
function tryLogin(){
  const pin=$id('pinInput').value;
  if(pin===state.config.pins.admin) session.role='admin';
  else if(pin===state.config.pins.staff) session.role='staff';
  else { $id('loginErr').textContent='PIN incorrecto'; $id('pinInput').value=''; return; }
  $id('loginErr').textContent=''; $id('pinInput').value='';
  $id('loginScreen').style.display='none'; $id('app').style.display='block';
  $id('topWho').textContent=isAdmin()?'Socio':'Staff';
  document.querySelectorAll('#mainTabs button').forEach(b=>{ b.style.display=(isAdmin()||!b.dataset.admin)?'':'none'; });
  setTab('hoy');
  alarmaTareas();
}
function logout(){
  if(sb){ sb.auth.signOut().finally(()=>location.reload()); return; }
  session.role=null; $id('app').style.display='none'; $id('loginScreen').style.display='flex'; setTimeout(()=>$id('pinInput').focus(),100);
}
function setTab(t){
  if(!isAdmin()&&['facturacion','config'].includes(t)) t='hoy';
  currentTab=t;
  if(t!=='clientes') cliId=null;
  document.querySelectorAll('#mainTabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  renderAll(); window.scrollTo(0,0);
}
function renderAll(){
  refreshTop();
  const m=$id('mainContent');
  switch(currentTab){
    case 'hoy': m.innerHTML=renderHoy(); break;
    case 'tablero': m.innerHTML=renderTablero(); break;
    case 'clientes': m.innerHTML= cliId? renderFichaCli(cliId) : renderClientes(); break;
    case 'documentos': m.innerHTML=renderDocumentos(); break;
    case 'tareas': m.innerHTML=renderTareas(); break;
    case 'tiempo': m.innerHTML=renderTiempo(); break;
    case 'facturacion': m.innerHTML=isAdmin()?renderFacturacion():''; break;
    case 'config': m.innerHTML=isAdmin()?renderConfig():''; break;
  }
}
function refreshTop(){
  $id('topClin').innerHTML=(state.config.firma.logo?'<img src="'+state.config.firma.logo+'" alt="" style="height:32px;vertical-align:middle;margin-right:8px;background:#fff;border-radius:5px;padding:1px">':'')+esc(state.config.firma.nombre);

function avisosFirma(){
  const f=state.config.firma, out=[];
  [[f.licVence,'Renovación de licencia / registro de la firma'],[f.educVence,'Fecha límite de educación continua']].forEach(par=>{
    if(!par[0]) return;
    const d=diffDias(par[0],hoyISO());

  });
  return out;

      +venc.slice(0,4).map(r=>esc((getCli(r.cliId)||{}).nombre)+' — '+esc(oblNombre(getObl(r.oblId)))+' ('+etiquetaPeriodo(r.periodo)+', venció '+fmtCorta(r.vence)+')').join(' · ')
      +(venc.length>4?' · y '+(venc.length-4)+' más':'')+'</div></div>';
  }
  h+='<div class="kpis">'
    +kpi(venc.length,'Vencidas',venc.length?'hot':'good')
    +kpi(prox.length,'Vencen en '+state.config.avisoDias+' días',prox.length?'':'good')
    +kpi(docsPend().length,'Documentos por recibir',docsPend().length?'hot':'good')
    +kpi(clientesActivos().length,'Clientes activos')
    +'</div>';

  /* vencimientos del propio contable: licencia y educación continua */
  const avf=avisosFirma();
  if(avf.length){
    h+='<div class="card" style="border-left:4px solid var(--violet)"><h2>🎓 Vencimientos de la firma</h2>';
    avf.forEach(a=>{
      h+='<div class="dl"><div class="dd '+(a.d<0?'r':a.d<=30?'a':'v')+'">'+(a.d<0?Math.abs(a.d):a.d)+'<small>'+(a.d<0?'ATRASO':'DÍAS')+'</small></div>'
        +'<div class="bd"><div class="n">'+esc(a.label)+'</div><div class="s">Vence '+fmtF(a.fecha)+' · las fechas se ajustan en Config</div></div></div>';
    });
    h+='</div>';
  }

  /* alarma de tareas: atrasadas, de hoy y las que vencen en 2 días */
  const tHoy=tareasPorVencer();
  if(tHoy.length){
    h+='<div class="card" style="border-left:4px solid var(--navy)"><h2>⏰ Tareas por vencer <span class="grow"></span>'
      +'<button class="btn sm ghost" onclick="setTab(\'tareas\')">Ver todas</button></h2>'
      +'<p class="tiny" style="margin-bottom:8px">Atrasadas, de hoy y de los próximos 2 días — para completarlas antes del límite.</p>';
    tHoy.slice(0,8).forEach(t=>{
      const c=t.cliId?getCli(t.cliId):null;
      const d=diffDias(t.vence,hoyISO());
      h+='<div class="dl"><div class="dd '+(d<0?'r':'a')+'">'+(d<0?Math.abs(d):(d===0?'HOY':d))+'<small>'+(d<0?'ATRASO':(d===0?'&nbsp;':'DÍAS'))+'</small></div>'
        +'<div class="bd"><div class="n">'+esc(t.titulo)+'</div>'
        +'<div class="s">'+(c?esc(c.nombre)+' · ':'')+(t.asignado?esc(t.asignado):'sin asignar')+' · vence '+fmtCorta(t.vence)+'</div></div>'
        +'<button class="btn xs ok" onclick="completarTarea(\''+t.id+'\')" title="Marcar completada">✓</button></div>';
    });
    if(tHoy.length>8) h+='<p class="tiny" style="margin-top:8px">y '+(tHoy.length-8)+' más en la pestaña Tareas.</p>';
    h+='</div>';
  }

  h+='<div class="card"><h2>Próximos 30 días <span class="grow"></span>'
    +'<button class="btn sm sec" onclick="accionGenerar()">Generar período</button>'
    +'<button class="btn sm ghost" onclick="printCalendario()">🖨️ Calendario</button></h2>';
  if(!mes30.length) h+='<div class="empty"><div class="big">✓</div>Nada vence en los próximos 30 días.</div>';

      +'<button class="btn xs sec" onclick="modalRad(\''+r.id+'\')">Abrir</button></div>';
  });

  const rads=state.radicaciones.filter(r=>r.cliId===cliId&&r.estado!=='radicado'&&r.estado!=='na'&&diffDias(r.vence,hoyISO())<=20)
    .sort((a,b)=>a.vence<b.vence?-1:1);
  const lineas=items.map(p=>'· '+p.item).join('\n');
  const urg= rads.length? '\n\nLo necesito para radicar '+oblNombre(getObl(rads[0].oblId))+', que vence el '+fmtF(rads[0].vence)+'.' : '';
  const msg='Saludos '+(cli.contacto||'').split(' ')[0]+', le escribe '+state.config.firma.nombre+'.\n\nPara continuar con su trabajo necesitamos:\n\n'+lineas+urg
    +'\n\nPuede mandarlos por este mismo WhatsApp o por correo. ¡Gracias!';
  return waLink(cli.tel,msg);
}

/* ══════════ TABLERO DE RADICACIÓN — elemento firma ══════════ */
function renderTablero(){
  const ref=tabMes;
  /* columnas: obligaciones que aplican a alguien en este período */
  const cols=[];
  state.config.obligaciones.forEach(obl=>{
    periodosDe(obl,ref).forEach(per=>{
      const venceEn=fechaVence(obl,per,null);
      const d=diffDias(venceEn,hoyISO());
      /* una prórroga mantiene viva la columna aunque la fecha original quedó atrás */
      const conProrroga=state.radicaciones.some(r=>r.oblId===obl.id&&r.periodo===per&&r.estado==='prorroga'&&Math.abs(diffDias(r.vence,hoyISO()))<=75);
      if((d<-45||d>75)&&!conProrroga) return;       /* ventana de trabajo */
      if(!clientesActivos().some(c=>aplicaA(c,obl))) return;
      cols.push({obl,per,vence:venceEn});
    });
  });
  cols.sort((a,b)=>a.vence<b.vence?-1:1);
  let h=AVISO;
  h+='<div class="card"><h2>Tablero de radicación <span class="grow"></span>'
    +'<input type="month" value="'+ref+'" onchange="tabMes=this.value;renderAll()" style="padding:7px 10px;border:1.5px solid var(--line-d);border-radius:8px;font-weight:600">'
    +'<button class="btn sm sec" onclick="accionGenerar()">Generar período</button>'
    +'<button class="btn sm ghost" onclick="printTablero()">🖨️ Imprimir</button></h2>';
  if(!cols.length){ h+='<div class="empty">Sin obligaciones en la ventana de este período. Pulsa "Generar período".</div></div>'; return h; }
  h+='<p class="tiny" style="margin-bottom:10px">Cada celda es una radicación. Un clic la marca radicada; vuelve a hacer clic para abrirla y anotar el número de confirmación de SURI.</p>';
  h+='<div class="rad-wrap"><table class="rad"><tr><th class="cli">Cliente</th>';
  cols.forEach(c=>{
    const d=diffDias(c.vence,hoyISO());
    h+='<th title="'+esc(c.obl.forma)+' — '+esc(c.obl.nombre)+' — vence '+fmtF(c.vence)+'">'+esc(oblNombre(c.obl))
      +'<br><span style="font-weight:600;color:'+(d<0?'var(--coral)':d<=state.config.avisoDias?'var(--gold)':'var(--faint)')+'">'+fmtCorta(c.vence)+'</span></th>';
  });
  h+='</tr>';
  clientesActivos().forEach(cli=>{
    h+='<tr><td class="cli" onclick="verCli(\''+cli.id+'\')" style="cursor:pointer">'+esc(cli.nombre)
      +'<span class="sub">'+esc(cli.tipo)+(cli.cierre!=='12'?' · cierre '+MESES_ABR[Number(cli.cierre)-1]:'')+'</span></td>';
    cols.forEach(c=>{
      if(!aplicaA(cli,c.obl)){ h+='<td><span class="chip na">—</span></td>'; return; }
      const r=asegurarRad(cli.id,c.obl.id,c.per);
      const est=estadoRad(r);
      const txt= est==='list'?'✓': est==='venc'?'!': est==='na'?'—': r.estado==='prorroga'?'P': (r.estado==='espera'?'⏳':(r.estado==='proceso'?'◐':'·'));
      h+='<td><span class="chip '+est+'" onclick="clickChip(\''+r.id+'\')" title="'+esc(cli.nombre)+' — '+esc(oblNombre(c.obl))+' '+etiquetaPeriodo(c.per)+'\n'+nombreEstado(r)+'\nVence '+fmtF(r.vence)+'">'+txt+'</span></td>';
    });
    h+='</tr>';
  });
  h+='</table></div>';
  h+='<div class="maplegend" style="margin-top:12px"><span><span class="dot" style="background:#2C7A54"></span>Radicado</span>'
    +'<span><span class="dot" style="background:#B5811F"></span>Próximo o en proceso</span>'
    +'<span><span class="dot" style="background:#C7442E"></span>Vencido</span>'
    +'<span><span class="dot" style="background:#5B5BA6"></span>P = en prórroga</span>'
    +'<span><span class="dot" style="background:#C5CDCB"></span>Pendiente</span>'
    +'<span>— No aplica a ese cliente</span></div>';
  h+='</div>';
  return h;
}

function leerCamposRad(r){
  return {
    asignado:$id('rd_asig')?$id('rd_asig').value:r.asignado,
    preparadoPor:$id('rd_prep')?$id('rd_prep').value:r.preparadoPor,
    revisadoPor:$id('rd_rev')?$id('rd_rev').value:r.revisadoPor,
    confirmacion:$id('rd_conf')?$id('rd_conf').value.trim():r.confirmacion,
    montoPago:$id('rd_pago')?($id('rd_pago').value===''?null:Number($id('rd_pago').value)):r.montoPago,
    pagoPend:$id('rd_bal')?$id('rd_bal').value==='1':r.pagoPend,
    notas:$id('rd_notas')?$id('rd_notas').value.trim():r.notas,
  };
}
function guardarRad(id){
  const r=state.radicaciones.find(x=>x.id===id); if(!r) return;
  Object.assign(r,leerCamposRad(r));
  r.vence=$id('rd_vence').value; r.estado=$id('rd_estado').value;
  r.radicado=$id('rd_fecha').value||null;
  if(r.estado==='radicado'&&!r.radicado) r.radicado=hoyISO();
  saveState(); closeModal(); renderAll(); toast('Guardado');
}
function marcarRadicado(id){
  const r=state.radicaciones.find(x=>x.id===id); if(!r) return;
  const obl=getObl(r.oblId);
  const vals=leerCamposRad(r);
  vals.radicado=$id('rd_fecha')&&$id('rd_fecha').value?$id('rd_fecha').value:hoyISO();
  const esAnual=obl&&(obl.frec==='anual'||obl.frec==='anual_cierre');
  if(esAnual&&!vals.revisadoPor){
    askConfirm('Esta planilla no tiene revisor anotado. El control de calidad pide que otra persona la revise antes de radicar. ¿Radicar de todos modos?',()=>aplicarRadicado(r,vals));
    return;
  }
  aplicarRadicado(r,vals);
}
function aplicarRadicado(r,vals){
  Object.assign(r,vals);
  r.estado='radicado';
  saveState(); closeModal(); renderAll();
  toast('Radicada'+(r.confirmacion?' — confirmación '+r.confirmacion:' — recuerda anotar la confirmación de SURI'), !r.confirmacion);
}
function modalProrroga(id){

function guardarProrroga(id){
  const r=state.radicaciones.find(x=>x.id===id); if(!r) return;
  const nueva=$id('pr_fecha').value;

  if(!r.venceOriginal) r.venceOriginal=r.vence;
  r.vence=nueva; r.estado='prorroga';
  r.prorroga={fecha:hoyISO(),conf};
  r.notas=(r.notas?r.notas+' · ':'')+'Prórroga registrada el '+fmtF(hoyISO())+(conf?' ('+conf+')':'');
  saveState(); closeModal(); renderAll();
  toast('Prórroga registrada — nuevo plazo para radicar: '+fmtF(nueva));

function guardarCli(id){
  const nombre=$id('cl_nom').value.trim();
  if(!nombre){ toast('Nombre requerido', true); return; }
  const perfil={};
  ['ivu','retiene','importa','arbitrios','patrono','noretenedor','estimada','patente','propiedad','banco','quickbooks','nomina'].forEach(k=>{ perfil[k]=$id('cp_'+k).checked; });
  const datos={nombre,ein:$id('cl_ein').value.trim(),tipo:$id('cl_tipo').value,cierre:$id('cl_cierre').value,
    tributacion:$id('cl_trib')?$id('cl_trib').value:'corp',
    honorario:Number($id('cl_hon').value)||0,contacto:$id('cl_cont').value.trim(),tel:$id('cl_tel').value.trim(),
    email:$id('cl_email').value.trim(),perfil,estado:$id('cl_estado').value,notas:$id('cl_notas').value.trim(),
    suriUsuario:$id('cl_suri_u').value.trim(),suriPass:$id('cl_suri_p').value};
  const renov={};
  (state.config.renovables||renovablesDefault()).forEach((nom,ix)=>{
    const chk=$id('rv_chk_'+ix);
    if(chk&&chk.checked) renov[nom]={num:$id('rv_num_'+ix).value.trim(),vence:$id('rv_ven_'+ix).value};
  });
  datos.renovaciones=renov;
  if(id){
    Object.assign(getCli(id),datos);
    /* si la LLC cambió de elección, la planilla del tipo que ya no aplica se marca N/A */
    if(datos.tipo==='LLC'){
      const fuera= datos.tributacion==='conducto' ? 'planilla_corp' : 'planilla_ec';
      state.radicaciones.forEach(r=>{ if(r.cliId===id&&r.oblId===fuera&&r.estado!=='radicado') r.estado='na'; });
    }
    toast('Cliente actualizado — regenera el período si cambiaste el perfil');
  }
  else{ const n=Object.assign({id:uid('c')},datos); state.clientes.push(n); cliId=n.id; currentTab='clientes';
        const g=generarPeriodo(tabMes); toast('Cliente creado — '+g+' radicación(es) generadas según su perfil'); }
  saveState(); closeModal(); renderAll();
}

function generarChecklist(){
  const pl=state.config.plantillasDocs||{};
  let n=0;
  clientesActivos().forEach(c=>{
    (pl[c.tipo]||[]).forEach(it=>{
      if(state.pendientes.some(p=>p.cliId===c.id&&p.item===it)) return;
      state.pendientes.push({id:uid('p'),cliId:c.id,item:it,solicitado:hoyISO(),recibido:null,notas:'Checklist de temporada'});

function renderTiempo(){
  const m=finMes;
  const ts=state.tiempo.filter(t=>t.fecha.slice(0,7)===m&&(tiempoQuien==='todos'||t.quien===tiempoQuien))
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const total=ts.reduce((s,t)=>s+t.minutos,0);
  const fact=ts.filter(t=>t.facturable).reduce((s,t)=>s+t.minutos,0);
  const pct= total? Math.round(fact/total*100) : 0;
  /* rentabilidad por cliente: honorario vs horas invertidas */
  const porCli={};
  state.tiempo.filter(t=>t.fecha.slice(0,7)===m).forEach(t=>{ porCli[t.cliId]=(porCli[t.cliId]||0)+t.minutos; });
  const optsQ='<option value="todos">Todo el equipo</option>'+state.config.staff.map(s=>'<option'+(tiempoQuien===s?' selected':'')+'>'+esc(s)+'</option>').join('');
  let h='<div class="card"><h2>Tiempo <span class="grow"></span>'
    +'<select onchange="tiempoQuien=this.value;renderAll()" style="padding:7px 10px;border:1.5px solid var(--line-d);border-radius:8px;font-weight:600">'+optsQ+'</select>'
    +'<input type="month" value="'+m+'" onchange="finMes=this.value;renderAll()" style="padding:7px 10px;border:1.5px solid var(--line-d);border-radius:8px;font-weight:600">'
    +'<button class="btn sm" onclick="modalTiempo(null)">+ Entrada</button></h2>';
  h+='<div class="kpis c3">'
    +kpi(hhmm(total),'Horas del mes')
    +kpi(hhmm(fact),'Facturables','good')
    +kpi(pct+'%','Aprovechamiento',pct>=70?'good':pct>=55?'':'hot')
    +'</div></div>';
  if(isAdmin()){
    h+='<div class="card"><h2>Rentabilidad por cliente — '+fmtMes(m)+'</h2>'
      +'<p class="tiny" style="margin-bottom:10px">Compara el honorario que cobras contra las horas que de verdad inviertes, a tu tarifa de '+money(state.config.tarifaHora)+'/hora. Aquí es donde descubres al cliente que te está costando dinero.</p>';
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th class="num">Horas</th><th class="num">Costo a tarifa</th><th class="num">Honorario</th><th class="num">Margen</th></tr></thead><tbody>';
    Object.keys(porCli).sort((a,b)=>porCli[b]-porCli[a]).forEach(cid=>{
      const c=getCli(cid); if(!c) return;
      const min=porCli[cid];
      const costo=Math.round(min/60*state.config.tarifaHora*100)/100;
      const margen=Math.round((c.honorario-costo)*100)/100;
      h+='<tr class="click" onclick="verCli(\''+cid+'\')"><td><b>'+esc(c.nombre)+'</b></td>'
        +'<td class="num">'+hhmm(min)+'</td><td class="num money">'+money(costo)+'</td>'
        +'<td class="num money">'+money(c.honorario)+'</td>'
        +'<td class="num money" style="color:'+(margen<0?'var(--coral)':'var(--ok)')+';font-weight:800">'+money(margen)+'</td></tr>';
    });
    h+='</tbody></table></div>'
      +'<p class="tiny" style="margin-top:6px">Margen en rojo = ese cliente consume más de lo que paga. Es la conversación de renegociación que llevas dos años posponiendo.</p></div>';
  }
  h+='<div class="card"><h2>Entradas de '+fmtMes(m)+'</h2>';
  if(!ts.length) h+='<div class="empty">Sin tiempo registrado.</div>';
  else{
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Cliente</th><th>Concepto</th><th>Quién</th><th class="num">Tiempo</th><th></th></tr></thead><tbody>';
    ts.forEach(t=>{
      const c=getCli(t.cliId);
      h+='<tr><td>'+fmtCorta(t.fecha)+'</td><td>'+esc(c?c.nombre:'')+'</td>'
        +'<td class="tiny">'+esc(t.concepto)+(t.facturable?'':' <span class="badge b-gray">no facturable</span>')+'</td>'
        +'<td class="tiny">'+esc(t.quien)+'</td><td class="num">'+hhmm(t.minutos)+'</td>'
        +'<td class="num"><button class="btn xs sec" onclick="modalTiempo(\''+t.id+'\')">Editar</button></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

      else if(d<=90) tramos['61-90']+=balanceFactura(f);

      +kpi(money(tramos['90+']),'Más de 90 días',tramos['90+']>0?'hot':'')

        +'<td class="num money" style="color:var(--coral);font-weight:700">'+money(balanceFactura(f))+'</td>'

    });

function factDesdeTiempo(){
  const cid=$id('fc_cli').value;
  const fecha=$id('fc_fecha').value||hoyISO();
  let m=fecha.slice(0,7);
  let min=minutosFacturables(cid,m);
  /* Se factura a principios de mes el trabajo del mes que cerró: si el mes
     de la factura está vacío, ofrecemos el anterior en vez de decir "no hay". */
  if(!min){
    const ant=mesRelDe(m,-1);
    const minAnt=minutosFacturables(cid,ant);
    if(minAnt){ m=ant; min=minAnt; }
  }
  if(!min){ toast('No hay tiempo facturable de ese cliente en '+fmtMes(fecha.slice(0,7))+' ni en el mes anterior', true); return; }
  const horas=Math.round(min/60*100)/100;
  factTempLineas.push({concepto:'Servicios profesionales — '+hhmm(min)+' en '+fmtMes(m),cant:horas,precio:state.config.tarifaHora});
  factRenderLineas();
  toast(hhmm(min)+' de '+fmtMes(m)+' añadidos a '+money(state.config.tarifaHora)+'/hora');
}
function factResumen(){
  const sub=factTempLineas.reduce((s,l)=>s+l.cant*l.precio,0);
  const exenta=$id('fc_ivu')&&$id('fc_ivu').value==='1';
  const ivu=(state.config.ivu.activo&&!exenta)?Math.round(sub*state.config.ivu.pct)/100:0;
  const ret=($id('fc_ret')&&$id('fc_ret').checked)?Math.round(sub*state.config.retencionPct)/100:0;
  const box=$id('fc_resumen');
  if(box) box.innerHTML='Subtotal '+money(sub)+(ivu?' + IVU '+state.config.ivu.pct+'%: '+money(ivu):' <span class="tiny">(exenta de IVU)</span>')
    +' · <b>Total facturado '+money(sub+ivu)+'</b>'
    +(ret?'<br>Menos retención en el origen '+state.config.retencionPct+'%: −'+money(ret)+' · <b>A recibir: '+money(sub+ivu-ret)+'</b>'
        +'<br><span class="tiny">La retención la remite el cliente a Hacienda a tu nombre y la acreditas en tu planilla.</span>':'');
}

function subirLogo(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const h=80, w=Math.max(1,Math.round(img.width*h/img.height));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      state.config.firma.logo=cv.toDataURL('image/png');
      saveState(); renderAll(); toast('Logo guardado');
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function importarJSON(inp){

}

      +'<td style="text-align:right">'+money(c.honorario)+'</td></tr>';
  });
  const tot=state.clientes.filter(c=>c.estado==='activo').reduce((s,c)=>s+c.honorario,0);
  doPrint('<div class="pr-doc">'+prHead('Cartera de clientes')
    +'<h2>Cartera — '+fmtF(hoyISO())+'</h2>'
    +'<table><tr><th>Cliente</th><th>Tipo</th><th>EIN/SS</th><th>Perfil contributivo</th><th>Honorario</th></tr>'+rows
    +'<tr><th colspan="4">HONORARIOS MENSUALES RECURRENTES</th><th style="text-align:right">'+money(tot)+'</th></tr></table>'
    +'<p class="fine">Documento interno confidencial. Contiene números de identificación contributiva.</p></div>');
}
function printExpediente(id){
  const c=getCli(id); if(!c) return;
  const rads=radsDe(id).sort((a,b)=>a.vence<b.vence?-1:1);
  let rowsR='';
  rads.forEach(r=>{ const o=getObl(r.oblId); if(!o) return;
    rowsR+='<tr><td>'+esc(o.forma)+'</td><td>'+etiquetaPeriodo(r.periodo)+'</td><td>'+fmtF(r.vence)+'</td>'
      +'<td>'+nombreEstado(r)+(r.pagoPend?' — BALANCE CON HACIENDA':'')+'</td>'
      +'<td>'+esc(r.preparadoPor||'')+(r.revisadoPor?' / '+esc(r.revisadoPor):'')+'</td>'
      +'<td>'+esc(r.confirmacion||'')+'</td></tr>'; });
  let rowsD='';
  docsDe(id).forEach(p=>{ rowsD+='<tr><td>'+esc(p.item)+'</td><td>'+fmtF(p.solicitado)+'</td><td>'+(p.recibido?fmtF(p.recibido):'PENDIENTE')+'</td></tr>'; });
  let rowsB='';
  bitacoraDe(id).forEach(b=>{ rowsB+='<tr><td>'+fmtF(b.fecha)+'</td><td>'+esc(b.quien)+'</td><td>'+esc(b.texto)+'</td></tr>'; });
  doPrint('<div class="pr-doc">'+prHead('Expediente del cliente')
    +'<h2>'+esc(c.nombre)+'</h2>'
    +'<table><tr><th>Tipo</th><td>'+esc(c.tipo)+'</td><th>EIN / SS</th><td>'+esc(c.ein||'—')+'</td></tr>'
    +'<tr><th>Contacto</th><td>'+esc(c.contacto||'—')+'</td><th>Teléfono</th><td>'+esc(c.tel||'—')+'</td></tr>'
    +'<tr><th>Cierre fiscal</th><td>'+MESES_FULL[Number(c.cierre)-1]+'</td><th>Honorario</th><td>'+money(c.honorario)+'</td></tr>'
    +'<tr><th>Perfil</th><td colspan="3">'+esc(etiquetasPerfil(c).join(' · '))+'</td></tr></table>'
    +'<h2 style="font-size:14px">Radicaciones</h2>'
    +'<table><tr><th>Forma</th><th>Período</th><th>Vence</th><th>Estado</th><th>Preparó / Revisó</th><th>Confirmación</th></tr>'+(rowsR||'<tr><td colspan="6">Sin radicaciones.</td></tr>')+'</table>'
    +(rowsD?'<h2 style="font-size:14px">Documentos</h2><table><tr><th>Documento</th><th>Solicitado</th><th>Recibido</th></tr>'+rowsD+'</table>':'')
    +(rowsB?'<h2 style="font-size:14px">Bitácora</h2><table><tr><th>Fecha</th><th>Quién</th><th>Anotación</th></tr>'+rowsB+'</table>':'')
    +'<p class="fine">'+FINE_LEY+'</p></div>');
}
function printFactura(id){
  const f=state.facturas.find(x=>x.id===id); if(!f) return;
  const c=getCli(f.cliId);
  let rows='';
  (f.lineas||[]).forEach(l=>{ rows+='<tr><td>'+esc(l.concepto)+'</td><td style="text-align:right">'+l.cant+'</td>'
    +'<td style="text-align:right">'+money(l.precio)+'</td><td style="text-align:right">'+money(l.cant*l.precio)+'</td></tr>'; });
  doPrint('<div class="pr-doc">'+prHead('Factura #'+f.num)
    +'<h2>Factura #'+f.num+'</h2>'
    +'<table><tr><th>Cliente</th><td>'+esc(c?c.nombre:'')+'</td><th>Fecha</th><td>'+fmtF(f.fecha)+'</td></tr>'
    +'<tr><th>EIN / SS</th><td>'+esc(c?c.ein||'—':'')+'</td><th>Contacto</th><td>'+esc(c?c.contacto||'':'')+'</td></tr></table>'
    +'<table><tr><th>Concepto</th><th>Cant.</th><th>Precio</th><th>Importe</th></tr>'+rows
    +'<tr><td colspan="3">Subtotal</td><td style="text-align:right">'+money(subFactura(f))+'</td></tr>'
    +(ivuFactura(f)?'<tr><td colspan="3">IVU '+state.config.ivu.pct+'%</td><td style="text-align:right">'+money(ivuFactura(f))+'</td></tr>'
                   :'<tr><td colspan="3">IVU</td><td style="text-align:right">Exenta</td></tr>')
    +'<tr><th colspan="3">TOTAL FACTURADO</th><th style="text-align:right">'+money(totalFactura(f))+'</th></tr>'
    +(retencionFactura(f)?'<tr><td colspan="3">Menos: retención en el origen '+state.config.retencionPct+'%</td><td style="text-align:right">−'+money(retencionFactura(f))+'</td></tr>'
      +'<tr><th colspan="3">NETO A PAGAR</th><th style="text-align:right">'+money(aCobrarFactura(f))+'</th></tr>':'')
    +(pagadoFactura(f)>0?'<tr><td colspan="3">Pagado</td><td style="text-align:right">−'+money(pagadoFactura(f))+'</td></tr>'
      +'<tr><th colspan="3">BALANCE</th><th style="text-align:right">'+money(balanceFactura(f))+'</th></tr>':'')
    +'</table>'
    +(retencionFactura(f)?'<p style="font-size:12px">Al pagar esta factura, favor de remitir el comprobante de retención correspondiente.</p>':'')
    +(f.notas?'<p style="font-size:12px">'+esc(f.notas)+'</p>':'')
    +'<p class="fine">'+esc(state.config.firma.nombre)+' · '+esc(state.config.firma.lic)+'. Gracias por su confianza.</p></div>');
}

}else{
  /* modo nube: login por email, cada firma ve solo lo suyo */
  $id('loginDemo').style.display='none'; $id('loginNube').style.display='block';
  $id('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loginNube(); });
  $id('emailInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $id('passInput').focus(); });
  entrarNube();
}
